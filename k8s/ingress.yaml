# PHASE 26: KUBERNETES INGRESS (Routing)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mahi-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - apiverse.mahi.com
    secretName: mahi-tls-secret
  rules:
  - host: apiverse.mahi.com
    http:
      paths:
      # Route /api traffic to the Fastify Backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: mahi-api-service
            port:
              number: 80
      # Route all other traffic to the Next.js Frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mahi-web-service
            port:
              number: 80
