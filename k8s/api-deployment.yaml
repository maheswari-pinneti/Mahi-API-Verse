# PHASE 26: KUBERNETES DEPLOYMENT (Backend API)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mahi-api-deployment
  labels:
    app: mahi-api
spec:
  replicas: 3 # High availability scaling
  selector:
    matchLabels:
      app: mahi-api
  template:
    metadata:
      labels:
        app: mahi-api
    spec:
      containers:
      - name: mahi-api
        image: ghcr.io/your-org/mahi-api:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mahi-secrets
              key: database-url
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mahi-api-service
spec:
  selector:
    app: mahi-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: ClusterIP
