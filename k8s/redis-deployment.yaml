apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-queue
  namespace: mahi-system
  labels:
    app: redis-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-queue
  template:
    metadata:
      labels:
        app: redis-queue
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue
  namespace: mahi-system
spec:
  selector:
    app: redis-queue
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
